<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Status Gallery | HumanRobot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0f12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Mobile Status Viewport Container */
    .status-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 860px;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    /* Top Progress Bar Container */
    .progress-container {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }

    .progress-segment {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      transition: width 0.1s linear;
    }

    /* Status Header Info */
    .status-header {
      position: absolute;
      top: 24px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .user-details {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #38ef7d;
      object-fit: cover;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .username {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .time-posted {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.75);
    }

    /* Audio Toggle Button */
    .volume-btn {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 0.9rem;
      z-index: 20;
    }

    /* Slides Wrapper */
    .slides-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slide.active {
      opacity: 1;
    }

    .slide video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Tap Control Zones */
    .tap-zone {
      position: absolute;
      top: 60px;
      bottom: 0;
      width: 50%;
      z-index: 5;
      cursor: pointer;
    }

    .tap-zone.left {
      left: 0;
    }

    .tap-zone.right {
      right: 0;
    }
  </style>
</head>
<body>

  <div class="status-container" id="statusContainer">
    <!-- Segmented Timer Bars -->
    <div class="progress-container" id="progressContainer"></div>

    <!-- User Information & Volume Controls Header -->
    <div class="status-header">
      <div class="user-details">
        <img src="HumanRobot.jpg" alt="Avatar" class="avatar">
        <div class="user-info">
          <span class="username">HumanRobot</span>
          <span class="time-posted">Cosmic & Mental Power</span>
        </div>
      </div>
      <button class="volume-btn" id="volumeBtn" title="Toggle Sound">🔊</button>
    </div>

    <!-- Video Slides Container -->
    <div class="slides-wrapper" id="slidesWrapper">

      <div class="slide">
        <video src="img/s21.mp4" playsinline></video>
      </div>
      <div class="slide">
        <video src="img/s20.mp4" playsinline></video>
      </div>
     <div class="slide">
        <video src="img/s19.mp4" playsinline></video>
      </div>
      <div class="slide">
        <video src="img/s1.mp4" playsinline></video>
      </div>
      <!-- <div class="slide">
        <video src="videos/status2.mp4" playsinline></video>
      </div>
      <div class="slide">
        <video src="videos/status3.mp4" playsinline></video>
      </div>
      <div class="slide">
        <video src="videos/status4.mp4" playsinline></video>
      </div>
      <div class="slide">
        <video src="videos/status5.mp4" playsinline></video>
      </div> -->
    </div>

    <!-- Interactive Tap Zones -->
    <div class="tap-zone left" id="tapLeft"></div>
    <div class="tap-zone right" id="tapRight"></div>
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const progressContainer = document.getElementById('progressContainer');
    const container = document.getElementById('statusContainer');
    const volumeBtn = document.getElementById('volumeBtn');
    
    let currentIndex = 0;
    let videoDuration = 5000;
    let startTime = null;
    let elapsedTime = 0;
    let animationFrameId = null;
    let isPaused = false;
    let isMuted = false; // Audio defaults to unmuted

    slides.forEach(() => {
      const segment = document.createElement('div');
      segment.classList.add('progress-segment');
      const fill = document.createElement('div');
      fill.classList.add('progress-fill');
      segment.appendChild(fill);
      progressContainer.appendChild(segment);
    });

    const fills = document.querySelectorAll('.progress-fill');

    function updateProgress(timestamp) {
      if (!startTime) startTime = timestamp;

      if (!isPaused) {
        elapsedTime = timestamp - startTime;
        const progressPercent = Math.min((elapsedTime / videoDuration) * 100, 100);
        fills[currentIndex].style.width = `${progressPercent}%`;

        if (elapsedTime >= videoDuration) {
          nextSlide();
          return;
        }
      }

      animationFrameId = requestAnimationFrame(updateProgress);
    }

    function showSlide(index) {
      cancelAnimationFrame(animationFrameId);
      
      slides.forEach((slide, i) => {
        const isCurrent = i === index;
        slide.classList.toggle('active', isCurrent);

        const video = slide.querySelector('video');
        if (video) {
          video.pause();
          video.currentTime = 0;
        }
      });

      fills.forEach((fill, i) => {
        if (i < index) {
          fill.style.width = '100%';
        } else if (i > index) {
          fill.style.width = '0%';
        } else {
          fill.style.width = '0%';
        }
      });

      currentIndex = index;
      startTime = null;
      elapsedTime = 0;

      const currentSlide = slides[currentIndex];
      const video = currentSlide.querySelector('video');

      if (video) {
        video.muted = isMuted;

        const startVideo = () => {
          videoDuration = video.duration ? video.duration * 1000 : 5000;
          video.play().catch(err => {
            console.log('Autoplay blocked unmuted audio; muting as fallback', err);
            // Fallback for strict browser autoplay policies
            video.muted = true;
            isMuted = true;
            volumeBtn.textContent = '🔇';
            video.play();
          });
          animationFrameId = requestAnimationFrame(updateProgress);
        };

        if (video.readyState >= 1) {
          startVideo();
        } else {
          video.onloadedmetadata = startVideo;
        }
      }
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        showSlide(currentIndex + 1);
      } else {
        showSlide(0);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        showSlide(currentIndex - 1);
      } else {
        showSlide(0);
      }
    }

    // Audio Toggle Listener
    volumeBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // Prevents triggering pause or slide navigation
      isMuted = !isMuted;
      volumeBtn.textContent = isMuted ? '🔇' : '🔊';

      const activeVideo = slides[currentIndex].querySelector('video');
      if (activeVideo) {
        activeVideo.muted = isMuted;
      }
    });

    document.getElementById('tapRight').addEventListener('click', () => nextSlide());
    document.getElementById('tapLeft').addEventListener('click', () => prevSlide());

    const pause = () => { 
      isPaused = true; 
      const activeVideo = slides[currentIndex].querySelector('video');
      if (activeVideo) activeVideo.pause();
    };

    const resume = () => { 
      if (isPaused) {
        isPaused = false; 
        const activeVideo = slides[currentIndex].querySelector('video');
        if (activeVideo) activeVideo.play().catch(() => {});
        startTime = performance.now() - elapsedTime;
        animationFrameId = requestAnimationFrame(updateProgress);
      }
    };

    container.addEventListener('mousedown', pause);
    container.addEventListener('mouseup', resume);
    container.addEventListener('mouseleave', resume);
    container.addEventListener('touchstart', pause, { passive: true });
    container.addEventListener('touchend', resume, { passive: true });

    showSlide(0);
  </script>
</body>
</html>
