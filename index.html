  let currentQuoteIndex = 303;

  // Determine daily quote based on the current day of the year (1 - 366 for leap year compatibility)
  function getDailyQuoteIndex() {
    const now = new Date();
    // Use Asia/Kolkata date to align with clock timezone
    const kolkataDateStr = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Kolkata', year: 'numeric', month: 'numeric', day: 'numeric' }).format(now);
    const kolkataDate = new Date(kolkataDateStr);
    
    const startOfYear = new Date(kolkataDate.getFullYear(), 0, 1);
    const diff = kolkataDate - startOfYear;
    const oneDay = 1000 * 60 * 60 * 24;
    const dayOfYear = Math.floor(diff / oneDay); // 0-indexed day of year
    
    return dayOfYear % quotes.length;
  }

  function displayQuote(index) {
    const quoteText = $('quote-text');
    const quoteAuthor = $('quote-author');
    const quoteDayLabel = $('quote-day-label');
    const quoteCard = $('quote-card');
    
    // Smooth transition effect
    quoteText.style.opacity = '0';
    quoteText.style.transform = 'translateY(4px)';
    quoteAuthor.style.opacity = '0';

    setTimeout(() => {
      quoteText.textContent = `“${quotes[index].quote}”`;
      quoteAuthor.textContent = quotes[index].author;
      quoteDayLabel.textContent = `HumanR✵B✵T Logic · Day ${index + 1} / 366`;
      quoteCard.title = `Click to cycle quotes (Day ${index + 1} of 366)`;
      
      quoteText.style.opacity = '1';
      quoteText.style.transform = 'translateY(0)';
      quoteAuthor.style.opacity = '1';
    }, 200);
  }

  function cycleQuote() {
    currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
    displayQuote(currentQuoteIndex);
  }

  function updateClock() {
    const now = new Date();
    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit',
      day: '2-digit', month: '2-digit', year: 'numeric', hourCycle: 'h23'
    }).formatToParts(now).reduce((acc, part) => (acc[part.type] = part.value, acc), {});
    
    const hours = Number(parts.hour), minutes = Number(parts.minute), seconds = Number(parts.second);
    const hourDeg = ((hours % 12) * 30) + minutes * .5;
    const minuteDeg = minutes * 6 + seconds * .1;
    const secondDeg = seconds * 6;
    
    $('hour').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
    $('minute').style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
    $('second').style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;
    $('digital-clock').textContent = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
    $('date').textContent = `${parts.day}-${parts.month}-${parts.year}`;
  }

  currentQuoteIndex = getDailyQuoteIndex();
  displayQuote(currentQuoteIndex);
  $('quote-card').addEventListener('click', cycleQuote);

  updateClock();
  setInterval(updateClock, 1000);
