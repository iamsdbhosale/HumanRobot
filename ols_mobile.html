<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>One-liner Status Creator — Web∞</title>
  <style>
    :root{
      --bg: #0f1724;
      --card: #0b1220;
      --muted: #9aa4b2;
      --text: #e6eef6;
      --accent: #7c5cff;
      --glass: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.15);
    }
    body.light{
      --bg: #f6f8fb;
      --card: #ffffff;
      --muted: #556270;
      --text: #0b1724;
      --accent: #5b21b6;
      --glass: rgba(10,10,10,0.03);
      --border: rgba(0,0,0,0.15);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial}
    body{
      background:linear-gradient(180deg,var(--bg), #06101a);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    }
    .app{width:100%;max-width:960px}
    .brand{text-align:center;margin-bottom:18px}
    .logo{
      font-weight:700;font-size:22px;letter-spacing:0.6px;
      background:linear-gradient(90deg,var(--accent),#ff5ca8);
      -webkit-background-clip:text;background-clip:text;color:transparent
    }
    .sub{color:var(--muted);font-size:13px;margin-top:6px}
    .card{
      background:var(--card);
      border-radius:12px;
      padding:18px;
      box-shadow:0 6px 18px rgba(2,6,23,0.6);
      border:1px solid var(--border);
    }
    textarea#status{
      width:100%;min-height:120px;background:transparent;
      border:1px dashed var(--border);color:var(--text);
      padding:14px;border-radius:8px;font-size:16px;resize:vertical;
    }
    .controls{
      display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;
    }
    .btn{
      background:linear-gradient(90deg,var(--accent),#ff5ca8);
      padding:8px 12px;border-radius:10px;border:none;
      color:white;font-weight:600;cursor:pointer;transition:0.2s;
    }
    .btn:hover{opacity:0.9;transform:scale(1.03)}
    .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
    .btn.small{padding:6px 8px;font-size:14px;border-radius:8px}
    .preview{
      margin-top:20px;padding:20px;border-radius:12px;
      border:2px solid var(--accent);
      background:linear-gradient(180deg,rgba(255,255,255,0.03),transparent);
      text-align:center;position:relative;
    }
    .preview .symbol{font-size:60px;line-height:1;margin-bottom:10px;display:block;color:var(--accent)}
    .preview .line{font-size:20px;line-height:1.5;font-weight:600;margin-bottom:10px}
    .branding{
      margin-top:16px;padding:10px;border-radius:8px;background:var(--glass);
      display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center
    }
    .tag{
      padding:6px 8px;border-radius:8px;
      background:linear-gradient(180deg,rgba(255,255,255,0.01),transparent);
      border:1px solid rgba(255,255,255,0.02);
      font-weight:600;font-size:13px
    }
    footer.small{margin-top:10px;color:var(--muted);font-size:13px;text-align:center}
    textarea:focus{outline:2px solid rgba(124,92,255,0.14);border-color:rgba(124,92,255,0.45)}
    @media(max-width:600px){
      .preview .symbol{font-size:44px}
      .preview .line{font-size:17px}
      .controls{justify-content:center}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="brand">
      <div class="logo">Web∞</div>
      <div class="sub">#tracgrggl + #iesefosp❣️ | Human 😊 Robot 🤖 | ✵ | Ψ | ₹ | $ | USD₮ | Ξ | ₿</div>
    </div>

    <div class="card">
      <label class="muted">Write one-liner status</label>
      <textarea id="status" maxlength="220" placeholder="e.g. Innovating under the moonlight ✨"></textarea>

      <div class="controls">
        <button class="btn" id="copyBtn">Copy</button>
        <button class="btn ghost small" id="clearBtn">Clear</button>
        <button class="btn ghost small" id="rndBtn">Random</button>
        <button class="btn ghost small" id="toggleTheme">Toggle Night/Day</button>
        <button class="btn" id="downloadBtn">Download PNG</button>
      </div>

      <div class="preview" id="preview">
        <span class="symbol">✵</span>
        <div class="line" id="previewLine">Your status preview will appear here.</div>
      </div>

      <div class="branding">
        <div class="tag">Web∞</div><div class="tag">#tracgrggl</div><div class="tag">#iesefosp❣️</div>
        <div class="tag">Human 😊</div><div class="tag">Robot 🤖</div><div class="tag">✵</div>
        <div class="tag">Ψ</div><div class="tag">₹</div><div class="tag">$</div>
        <div class="tag">USD₮</div><div class="tag">Ξ</div><div class="tag">₿</div>
      </div>

      <footer class="small">Made with ❤️ — Web∞ | #tracgrggl + #iesefosp❣️</footer>
    </div>
  </div>

  <!-- html2canvas CDN for PNG download -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const status = document.getElementById('status');
    const previewLine = document.getElementById('previewLine');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const rndBtn = document.getElementById('rndBtn');
    const toggleTheme = document.getElementById('toggleTheme');
    const downloadBtn = document.getElementById('downloadBtn');

    function updatePreview(){
      const v = status.value.trim();
      previewLine.textContent = v || 'Your status preview will appear here.';
    }
    status.addEventListener('input', updatePreview);

    copyBtn.addEventListener('click', async ()=>{
      const text = status.value.trim();
      if(!text) return;
      const signature = 'Web∞ | #tracgrggl + #iesefosp❣️| Human 😊 Robot 🤖|✵|Ψ|₹|$|USD₮|Ξ|₿';
      await navigator.clipboard.writeText(`${text}\n\n— ${signature}`);
      copyBtn.textContent = 'Copied ✓';
      setTimeout(()=>copyBtn.textContent='Copy',1500);
    });

    clearBtn.addEventListener('click', ()=>{status.value='';updatePreview();});

    rndBtn.addEventListener('click', ()=>{
      const samples = [
        'Dreaming in code and caffeine ☕️',
        'Stars don’t compete, they shine ✨',
        'Logic is poetry in motion 💡',
        'Between zeros and ones, I find peace 💻'
      ];
      const pick = samples[Math.floor(Math.random()*samples.length)];
      status.value = pick;
      updatePreview();
    });

    toggleTheme.addEventListener('click', ()=>{
      document.body.classList.toggle('light');
    });

    // PNG Download logic
    downloadBtn.addEventListener('click', ()=>{
      const preview = document.getElementById('preview');
      html2canvas(preview, {scale:3, backgroundColor:null}).then(canvas=>{
        const link = document.createElement('a');
        link.download = 'one-liner-status.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    });

    updatePreview();
  </script>
</body>
</html>
